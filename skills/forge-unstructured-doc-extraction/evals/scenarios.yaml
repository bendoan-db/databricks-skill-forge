# End-to-end certification scenarios for forge-unstructured-doc-extraction.
# forge_ucs_validate runs these on every PR (U5), and forge_ucs_drift runs them on each base release (U9).
# Each run executes modules 00-03 in a sandbox workspace twice: with this skill (candidate) and with
# base skills only (base-only). The candidate must pass every check and must not score below base-only.
# forge-doc-qa-agent's scenarios build their agents on these indexes, so teardown waits until they finish.

defaults:
  harness:
    entry: forge                             # each run starts as `/forge <scenario description>`; routing evals are in skills/forge/evals/routing.yaml
    auto_approve_cost_gates: sandbox_only    # never auto-approve outside the certification workspace
    teardown: [index, endpoint_if_created, job, tables, page_images_volume]
    upstream_versions: [v0.2.27, latest]     # databricks-agent-skills installed next to the skill: ucs.yaml upstream_min, and the newest tag
  thresholds:                                # same floors as scripts/evaluate.py THRESHOLDS
    doc_hit_rate: 0.9
    page_hit_rate: 0.8
  checks:                                    # apply to every scenario, in addition to its own checks
    - no_knowledge_assistant                 # the agent never creates or suggests an Agent Bricks Knowledge Assistant (being deprecated)

scenarios:
  - id: financebench-sec-filings
    description: SEC filings with metadata filters, scored against the foundation repo's labeled questions
    source:
      repo: https://github.com/bendoan-db/databricks-financebench-agent
      documents: data/pdfs                   # 368 PDFs, ~673 MB
      eval_set: data/finance_bench_evals.tsv # 150 rows: request, expected_response, expected_retrieved_context[{content, doc_uri}]
    sample:
      # doc_uri basenames carry a 'financebench' prefix; strip it to match data/pdfs file names, and use it as file_name.
      questions: 30                          # stratify by company; keep only questions whose doc_uri is in the document sample
      documents: questions_plus_distractors  # each sampled question's source docs + 10 random others
    inputs:
      vs_endpoint: forge-cert-vs                # an existing endpoint the harness principal can use
      index_name: financebench_filings_index
      continuous_updates: true
      metadata_schema: >-
        {"company": {"type": "string", "description": "Issuer common name in upper case with no spaces or punctuation, e.g. JOHNSONJOHNSON"},
         "document_type": {"type": "enum", "labels": ["10K", "10Q", "8K", "EARNINGS"]},
         "fiscal_year": {"type": "integer", "description": "Fiscal year the document covers"}}
    checks:
      - parsed_files == sampled_documents
      - chunks_index.indexed_row_count == chunks.count
      - missing_metadata_ratio <= 0.10
      - filter_values.company is not null    # recorded in doc-index.json for forge-doc-qa-agent's tool
      - doc_hit_rate >= 0.9                  # no pages in this eval set, so page_hit_rate isn't measured

  - id: mixed-office-docs
    description: Non-PDF formats and no metadata schema; covers parse options and synthetic eval sets
    source:
      generate: databricks-unstructured-pdf-generation   # base skill; also add 3 DOCX, 2 PPTX, 2 PNG scans
      documents: 15
    inputs:
      vs_endpoint: null                      # the harness principal is a workspace admin: module 00 proposes <name>-vs
      continuous_updates: true               # incremental-refresh depends on the file-arrival trigger
      metadata_schema: ""
    eval_set: synthetic                      # module 03 synthesis, 15 questions
    checks:
      - parsed_files == 15
      - chunks_index.indexed_row_count == chunks.count
      - endpoint_created_after_cost_go_ahead
      - synthetic_rows_labeled >= 14/15      # generate_evals_df returned the source chunk for each question

  - id: chart-heavy-deck
    description: Answers that live in chart values; chart insights on
    source:
      repo: https://github.com/databricks-solutions/advance-document-processing
      documents: document-embedding-chart-analysis/sample_data       # meta-earning-presentation.pdf
    inputs:
      continuous_updates: false              # one deck, built once
      page_images: true
      chart_insights: true
    eval_set: synthetic                      # module 03 synthesis, plus 5 hand-written questions about values only in charts, labeled with their pages
    checks:
      - chart_insights.count > 0 and chart_insights.errors == 0
      - chart_value_questions_page_hit >= 4/5
      - job.trigger is null and job.schedule is null

  - id: incremental-refresh
    description: The file-arrival job picks up an added file and drops a deleted one without reparsing others
    depends_on: mixed-office-docs
    steps: [add 1 new PDF, delete 1 existing file, wait for the job run]
    checks:
      - changed_files == 1                   # parse.py summary for the triggered run
      - documents_chunked == 1               # prep_chunks.py summary: no other document re-chunked
      - deleted_file_chunks == 0
      - new_file_retrieved                   # a question about the new file returns one of its chunks

  - id: requirements-asked-first
    description: The agent asks for the four requirements before anything else, and stops when no endpoint is named and the user can't create one
    run_as: non_admin                        # sandbox principal outside the admins group, with no CAN CREATE on AI Search endpoints
    harness_answers:
      volume_path: /Volumes/forge_cert/docs/sample
      vs_endpoint: null
      index_name: sample_chunks_index
      continuous_updates: false
      can_create_endpoints: "I don't know"
    stop_after: 00-preflight
    checks:
      - first_question_asks [volume_path, vs_endpoint, index_name, continuous_updates]
      - asked_user_to_specify_endpoint       # and listed the ONLINE endpoints to choose from
      - no_billable_actions                  # nothing parsed, no endpoint, no job

