# Template for the parse, chunk, and index refresh job of the forge-unstructured-doc-extraction use-case skill (modules 01-02).
# Don't fill it by hand: `render.py` writes <name>-index/databricks.yml from doc-index.json,
# replacing each whole-value <key> with a quoted value, and copies the job's notebooks and SQL to src/.
# Each task is a notebook task: base_parameters reach the notebook as widgets named like its flags, and each
# notebook installs its own packages with %pip, so the job has no environment.
bundle:
  name: <bundle_name>

variables:
  catalog:
    description: Catalog for the tables and index
    default: <catalog>
  schema:
    description: Schema for the tables and index
    default: <schema>
  prefix:
    description: Table prefix (<prefix>_parsed, <prefix>_chunks)
    default: <prefix>
  index_name:
    description: AI Search index name, created in the same catalog and schema
    default: <index_name>
  volume_path:
    description: Source volume path, no trailing slash
    default: <volume_path>
  metadata_schema:
    description: JSON array or ai_extract-style object for ai_prep_search; empty disables metadata
    default: <metadata_schema>
  metadata_columns:
    description: Comma-separated keys of metadata_schema (index columns_to_sync); render.py derives it
    default: <metadata_columns>
  description_element_types:
    description: ai_parse_document descriptionElementTypes ('*', 'figure', or '' to save cost)
    default: <description_element_types>
  page_images_path:
    description: Volume directory for rendered page images; empty disables
    default: <page_images_path>
  split_pages:
    description: "'folder' when each folder holds the single-page files of one document, else 'none'"
    default: <split_pages>
  chart_insights:
    description: "'true' to read charts with a vision model before chunking"
    default: <chart_insights>
  chart_model:
    description: system.ai model for chart reading; empty uses the script default
    default: <chart_model>
  chart_prompt:
    description: Prompt for chart reading; empty uses the script default
    default: <chart_prompt>
  chart_source:
    description: "'vision' to read chart crops with chart_model; 'builtin' to use the parser's chart data (no model calls)"
    default: <chart_source>
  vs_endpoint:
    description: AI Search endpoint name
    default: <vs_endpoint>
  embedding_model:
    description: Embedding serving endpoint for managed embeddings
    default: <embedding_model>

resources:
  jobs:
    doc_index:
      name: doc-index ${var.prefix}
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: full_refresh  # `databricks bundle run doc_index --params full_refresh=true` re-chunks without re-parsing
          default: "false"
      trigger:  # continuous_updates; render.py drops it, or swaps in schedule_cron
        pause_status: UNPAUSED
        file_arrival:
          url: ${var.volume_path}/
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 120
      tasks:
        - task_key: parse
          notebook_task:
            notebook_path: src/parse.py  # %pip installs pypdf, for page counts that route PDFs over 500 pages to slices
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              prefix: ${var.prefix}
              volume_path: ${var.volume_path}
              description_element_types: ${var.description_element_types}
              page_images_path: ${var.page_images_path}
              split_pages: ${var.split_pages}
              sql_dir: ${workspace.file_path}/src
        - task_key: chunk
          depends_on:
            - task_key: parse
          notebook_task:
            notebook_path: src/prep_chunks.py  # %pip installs pillow and pypdfium2, for chart crops
            base_parameters:  # full_refresh: the job parameter reaches the notebook as a widget on its own
              catalog: ${var.catalog}
              schema: ${var.schema}
              prefix: ${var.prefix}
              metadata_schema: ${var.metadata_schema}
              chart_insights: ${var.chart_insights}
              chart_model: ${var.chart_model}
              chart_prompt: ${var.chart_prompt}
              chart_source: ${var.chart_source}
              sql_dir: ${workspace.file_path}/src
        - task_key: sync_index
          depends_on:
            - task_key: chunk
          notebook_task:
            notebook_path: src/sync_index.py  # %pip installs the databricks-sdk version with the AI Search APIs it uses
            base_parameters:
              chunks_table: ${var.catalog}.${var.schema}.${var.prefix}_chunks
              index_name: ${var.catalog}.${var.schema}.${var.index_name}
              endpoint: ${var.vs_endpoint}
              embedding_model: ${var.embedding_model}
              metadata_columns: ${var.metadata_columns}

targets:
  # No `mode: development`: development mode forces triggers to PAUSED, and this job exists to react to new files.
  default:
    default: true
    workspace:
      profile: <profile>
