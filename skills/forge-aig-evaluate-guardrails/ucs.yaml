# Source of truth for this use-case skill's dependency graph. Drift detection reads it, CI checks it against the module text,
# and scripts/check_base_skills.py reads base_skills at runtime.
name: forge-aig-evaluate-guardrails
version: 0.3.0
owner: "@databricks-field/genai-ucs"        # drift issues are assigned here
dbs_release: dbs-2026.11                    # Forge base release; not published yet, so `upstream` is the working pin
upstream: databricks/databricks-agent-skills@v0.2.34   # written against this tag; not yet certified in a workspace
upstream_min: v0.2.27                       # oldest tag with every cited base skill and reference file
source:
  repo: https://github.com/bendoan-db/uaig-guardrail-evals
  commit: 827c9e5
  ported: the gateway calls and fail-closed rule, scoring, MLflow logging   # creating the model service moved to forge-aig-create-model-service (0.2.0)
inputs:
  required: [target_schema, dataset]        # dataset: module 00 asks; without one, the default datasets
  optional: [services, profile, job_name, table_prefix, base_model, default_evaluator_model, sample_size, concurrency]
requires:                                   # use-case skills this one runs first; check_base_skills.py checks them too
  - name: forge-aig-create-model-service
    version: 0.2.0                          # runtime workspace: its scripts sign in as the notebook's user
    uses: [aig-model-services.json (runtime, parts, config_dir, completed), model-services.yaml (the evaluation's services and their policies), service-policies.yaml (policy types, mode, and action), permissions.yaml (services granted to others), creating the services and checking their privileges]
shared:                                     # identical in every skill that carries them; tests/test_skills.py checks
  - scripts/check_base_skills.py
  - scripts/write_readme.py
  - scripts/job.py                         # with forge-structured-doc-extraction

catalog:                                    # forge's use-case table; tools/build_forge_catalog.py renders it into skills/forge/SKILL.md
  title: Guardrail evaluation
  choose_when: how well Unity AI Gateway guardrails (service policies, built-in for sensitive data, unsafe content, and jailbreaks, or custom LLM-judge and SQL rules) block unsafe prompts and let safe ones through, measured on a safety dataset; guardrail recall, false positives, comparing guardrail setups or evaluators side by side, or red-teaming a copy of a model service's policies; it has forge-aig-create-model-service create the services it measures
  not_for: setting up model services and their guardrails for users (forge-aig-create-model-service); evaluating a document agent's answers (forge-doc-qa-agent)
  produces: model services of the evaluation's own with the guardrails attached, every prompt's verdict and blocking guardrail for each service in a results table, and recall, precision, false-positive rate, and F1 for each service, overall, per dataset, per category, and per guardrail, in Delta tables and MLflow
  state_file: guardrail-eval.json           # forge offers to resume this skill when the file is in <workdir>
  next: []

modules:
  - id: 00-preflight
    file: modules/00-preflight.md
    scripts: [scripts/check_base_skills.py]
    base_skills:
      - name: databricks-core
        version: 0.1.0
        uses: [profile selection, auth, warehouse discovery]
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [effective grants]

  - id: 01-dataset
    file: modules/01-dataset.md
    scripts: [scripts/render.py, scripts/databricks.yml, scripts/load_prompts.py, scripts/job.py]
    base_skills:
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [volumes, staging files with databricks fs cp]
      - name: databricks-dabs
        version: unversioned                # upstream SKILL.md has no metadata.version
        uses: [bundle validate, deploy, run --only]

  - id: 02-guardrails
    file: modules/02-guardrails.md
    scripts: [scripts/check_services.py]
    base_skills:
      - name: databricks-unity-gateway
        version: 0.1.0
        uses: [who holds privileges on a model service, querying the unified chat completions API]

  - id: 03-evaluate
    file: modules/03-evaluate.md
    scripts: [scripts/run_eval.py, scripts/evaluate.py, scripts/job.py]
    base_skills:
      - name: databricks-dabs
        version: unversioned
        uses: [bundle run with job parameters]
    external:
      - name: mlflow-skinny
        version: ">=3"
        uses: [log_params, log_metrics, log_dict]

# Capabilities this skill needs but the pinned base release doesn't cover, or covers with stale facts.
# SKILL.md "Base-skill guidance to override" holds the runtime instructions for each entry.
# Drafts of the upstream change proposals: docs/aig-evaluate-guardrails-upstream-proposals.md.
coverage_gaps:
  - capability: Guardrails (service policies) on model services, including the built-in policies, their options (dry_run, action, categories), and the blocked response
    modules: [00-preflight, 02-guardrails, 03-evaluate]
    kind: missing
    evidence:
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/
        date_modified: 2026-10-29
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/create-service-policy
        date_modified: 2026-10-29
  - capability: Reading a model service's service policies, which the typed CLI leaves out
    modules: [02-guardrails]
    kind: missing
    evidence: []                             # from the source (CLI 1.18.0, 2026-10-01): get-model-service omits config.service_policies. Recheck on newer CLIs

# Platform facts this skill hard-codes. The refiner re-checks them like coverage_gaps; when one changes,
# update every file in used_in.
facts:
  - fact: The built-in guardrails are system.ai.detect_sensitive_data, block_unsafe_content, block_jailbreak (input only on model services), and block_hallucination (output only)
    used_in: [scripts/check_services.py, SKILL.md, modules/00-preflight.md, modules/02-guardrails.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/
        checked: 2026-11-02
  - fact: Sensitive Data Detection detects 15 classification tags, class.email_address through class.in_aadhaar, and blocks or redacts
    used_in: [scripts/check_services.py, modules/00-preflight.md, modules/02-guardrails.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/detect-sensitive-data
        checked: 2026-11-02
  - fact: A blocked call returns HTTP 200 with a top-level databricks_service_policy object; a policy that fails to evaluate denies the request (fail closed)
    used_in: [scripts/run_eval.py, scripts/check_services.py, modules/03-evaluate.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/
        checked: 2026-11-02
  - fact: The Unity Gateway Service Policies preview is enabled by a workspace admin, and policy changes take a minute or two to propagate
    used_in: [modules/00-preflight.md, modules/02-guardrails.md, scripts/run_eval.py]
  - fact: A policy in log mode (dry_run) records its decision without blocking, and Sensitive Data Detection with action transform (redact) masks instead of blocking, so neither leaves a verdict in the reply
    used_in: [scripts/render.py, scripts/check_services.py, SKILL.md, modules/00-preflight.md, modules/02-guardrails.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/service-policies/create-service-policy
        checked: 2026-11-12                  # log mode and redaction as the docs describe them; that a redaction leaves no marker in the reply isn't confirmed in a workspace
  - fact: The default evaluator (default_evaluator_model) is system.ai.gpt-oss-20b, and the built-in Unsafe Content guardrail's own is system.ai.gemma-3-12b
    kind: heuristic                          # the source's tested choices; the docs say the form preselects a default without naming it
    used_in: [SKILL.md, modules/00-preflight.md, modules/02-guardrails.md, README.md]
    evidence: []
  - fact: The default datasets are Aegis 2.0's test split (revision d86bb8b, CC BY 4.0) and ToxicChat 0124's test split (revision 29df8e4, CC BY-NC 4.0), checked by sha256
    used_in: [scripts/load_prompts.py, SKILL.md, modules/00-preflight.md, modules/01-dataset.md]
    evidence:
      - url: https://huggingface.co/datasets/nvidia/Aegis-AI-Content-Safety-Dataset-2.0
        checked: 2026-11-02
      - url: https://huggingface.co/datasets/lmsys/toxic-chat
        checked: 2026-11-02
  - fact: Serverless retries a failed task even with max_retries 0 unless disable_auto_optimization is set
    used_in: [scripts/databricks.yml]
    evidence: []                             # from the source (2026-10-01); confirm in a workspace
  - fact: In Genie Code in a notebook, the SDK signs in as the notebook's user only in the notebook's own Python process, so the scripts run there through runpy (forge_run), not as subprocesses
    kind: heuristic                          # the SDK's notebook sign-in reads the notebook's REPL context, which a subprocess doesn't have; not yet tried in a workspace
    used_in: [SKILL.md, scripts/job.py, scripts/check_services.py, scripts/evaluate.py]
    evidence: []
  - fact: A file written through /Workspace is a workspace file, not a notebook, and serverless doesn't guarantee a notebook's working directory; the Workspace import API with format SOURCE and a language makes a notebook
    used_in: [SKILL.md, scripts/job.py]
    evidence:
      - url: https://docs.databricks.com/aws/en/files/workspace-interact
        checked: 2026-11-12
      - url: https://docs.databricks.com/api/workspace/workspace/import
        checked: 2026-11-12
  - fact: A run passes at a scored rate of 0.98
    kind: heuristic                          # errors (calls that failed after retries) above 2% make the rates unreliable
    used_in: [scripts/evaluate.py, modules/03-evaluate.md, SKILL.md, evals/scenarios.yaml]
    evidence: []

scenarios: evals/scenarios.yaml
