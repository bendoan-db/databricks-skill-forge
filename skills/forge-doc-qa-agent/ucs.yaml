# Source of truth for this use-case skill's dependency graph. Drift detection reads it, CI checks it against the module text,
# and scripts/check_base_skills.py reads base_skills at runtime.
name: forge-doc-qa-agent
version: 0.4.0
owner: "@databricks-field/genai-ucs"        # drift issues are assigned here
dbs_release: dbs-2026.10                    # Forge base release; not published yet, so `upstream` is the working pin
upstream: databricks/databricks-agent-skills@v0.2.29   # written and certified against this tag (2026-10-12)
upstream_min: v0.2.27                       # oldest tag with every cited base skill and reference file
inputs:
  required: []                              # the volume_path is forge-unstructured-doc-extraction's input, when it runs first
  optional: [index_state, name, chat_model, eval_set]
requires:                                   # use-case skills this one runs first; check_base_skills.py checks them too
  - name: forge-unstructured-doc-extraction
    version: 0.1.0
    uses: [doc-index.json, index_name and its columns (chunk_id, file_name, page_numbers, source_uri), filter_values, corpus_description, evals.jsonl]
shared:                                     # identical in every skill that carries them; tests/test_skills.py checks
  - scripts/check_base_skills.py

catalog:                                    # forge's use-case table; tools/build_forge_catalog.py renders it into skills/forge/SKILL.md
  title: Document Q&A agent
  choose_when: an agent or chatbot that answers questions about documents and cites the file and page (RAG); it builds the index first if needed
  not_for: only a search index (forge-unstructured-doc-extraction); field values in tables (forge-structured-doc-extraction)
  produces: a LangGraph agent on Databricks Apps, with sessions, citations, and an MLflow evaluation
  state_file: doc-qa.json                   # forge offers to resume this skill when the file is in <workdir>
  next: []

modules:
  - id: 00-preflight
    file: modules/00-preflight.md
    scripts: [scripts/check_base_skills.py]
    base_skills:
      - name: databricks-core
        version: 0.1.0
        uses: [profile selection, auth]
      - name: databricks-unity-gateway
        version: 0.1.0
        uses: [list system.ai model services, sovereign-cloud fallback]
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [effective grants]

  - id: 01-agent
    file: modules/01-agent.md
    scripts: [scripts/render.py, scripts/retrieval.py]
    base_skills:
      - name: databricks-unity-gateway
        version: 0.1.0
        uses: [system.ai model service permissions]
      - name: databricks-vector-search
        version: 0.1.0
        uses: [VectorSearchRetrieverTool]
    external:
      - name: databricks-agentbricks
        version: ">=0.5.0,<0.6"             # module 01 edits files generated by the 0.5 template; re-certify before widening
        uses: [init --framework langgraph --session-store, memory unbind, doctor, dev, agent-langgraph template]

  - id: 02-deploy-app
    file: modules/02-deploy-app.md
    scripts: [scripts/grant_index_access.py]
    base_skills:
      - name: databricks-apps-python
        version: 0.1.0
        uses: [app resources (uc_securable), app vs user authorization]
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [GRANT fallback]
    external:
      - name: databricks-agentbricks
        version: ">=0.5.0,<0.6"
        uses: [deploy, deployments get/logs, endpoint invoke]

  - id: 03-evaluate
    file: modules/03-evaluate.md
    scripts: [scripts/evaluate.py]
    base_skills:
      - name: databricks-mlflow-evaluation
        version: 0.1.0
        uses: [mlflow.genai.evaluate, built-in scorers, Guidelines, local predict_fn, trace ingestion]

# Capabilities this skill needs but the pinned base release doesn't cover, or covers with stale facts.
# The base-skill refiner reads these as routing hints (v_coverage_gaps). Docs win over base skills.
# SKILL.md "Base-skill guidance to override" holds the runtime instructions for each entry.
# After filing a change proposal upstream (drafts: docs/doc-qa-agent-upstream-proposals.md and, for the AI Search rename,
# docs/unstructured-doc-extraction-upstream-proposals.md), add `upstream_issue: <url>`.
coverage_gaps:
  - capability: Agent Bricks CLI, agent.toml, DurableAgentServer, Agent Runtime on Databricks Apps
    modules: [01-agent, 02-deploy-app]
    kind: missing
    evidence:
      - url: https://docs.databricks.com/aws/en/agents/custom-agents/agent-bricks-cli
        date_modified: 2026-10-13
      - url: https://docs.databricks.com/aws/en/agents/deploy/agent-runtime
        date_modified: 2026-10-06
    stale_base_guidance: databricks-ml-training/references/genai-agents.md deploys LangGraph agents with agents.deploy() to Model Serving
  - capability: Managed agent sessions and memory stores
    modules: [01-agent]
    kind: missing
    evidence:
      - url: https://docs.databricks.com/aws/en/agents/custom-agents/stateful-agents
        date_modified: 2026-10-13
  - capability: Knowledge Assistant (databricks-agent-bricks) offered for document Q&A
    modules: [01-agent]
    kind: deprecated
    evidence: []                             # skill owner, 2026-10-15: Knowledge Assistant is being deprecated; add the notice URL once published
    stale_base_guidance: databricks-agent-bricks describes Knowledge Assistants for document Q&A
  - capability: AI Search rename and databricks-ai-search client
    modules: [01-agent]
    kind: stale
    evidence:
      - url: https://docs.databricks.com/aws/en/ai-search/ai-search
        date_modified: 2026-09-14

# Platform facts this skill hard-codes. The refiner re-checks them like coverage_gaps; when one changes,
# update every file in used_in.
facts:
  - fact: App names are at most 30 characters, so <name> is at most 17
    used_in: [SKILL.md, modules/00-preflight.md, modules/02-deploy-app.md, scripts/render.py]
    evidence:
      - base_skill: databricks-dabs
        file: references/bundle-structure.md
        checked: 2026-10-15
  - fact: The default chat model is Claude Sonnet 5.5, model service system.ai.claude-sonnet-5-5 (legacy endpoint databricks-claude-sonnet-5-5)
    used_in: [SKILL.md, modules/00-preflight.md, modules/01-agent.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models
        checked: 2026-10-15

scenarios: evals/scenarios.yaml
