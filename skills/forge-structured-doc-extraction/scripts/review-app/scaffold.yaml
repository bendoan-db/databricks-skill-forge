# The AppKit project of forge-structured-doc-extraction's review app, for a notebook (runtime workspace), where
# `databricks apps init` can't run: render.py writes these files into <workdir>/<review.app_name>/ once, and never
# replaces them, then copies server.ts, review-routes.ts, and App.tsx over them as it does locally. Databricks Apps
# runs `npm install` and `npm run build` when the app deploys. Don't edit by hand: regenerate with
# `uv run tools/vendor_review_app_scaffold.py --version <tag>` (AppKit, Apache-2.0: github.com/databricks/appkit).
# render.py fills {{app_name}}, {{volume}}, {{branch}}, and {{database}}.
appkit_version: 0.84.0
files:
  .gitignore: |+
    .DS_Store
    node_modules/
    client/dist/
    dist/
    build/
    .env
    .databricks/
    .smoke-test/
    test-results/
    playwright-report/

    # Auto-generated types (endpoint-specific, varies per developer)
    shared/appkit-types/serving.d.ts

  .npmrc: |
    # pnpm 11 needs this to run prebuild (AppKit typegen) before build.
    enable-pre-post-scripts=true
  app.yaml: |
    command: ['npm', 'run', 'start']
    env:
      - name: DATABRICKS_VOLUME_FILES
        valueFrom: files
      - name: LAKEBASE_ENDPOINT
        valueFrom: postgres
  appkit.plugins.json: |
    {
      "$schema": "https://databricks.github.io/appkit/schemas/template-plugins.schema.json",
      "version": "2.0",
      "plugins": {
        "agents": {
          "name": "agents",
          "displayName": "Agents Plugin",
          "description": "AI agents driven by markdown configs or code, with auto-tool-discovery from registered plugins",
          "package": "@databricks/appkit",
          "resources": {
            "required": [],
            "optional": [
              {
                "type": "serving_endpoint",
                "alias": "Default LLM for agents",
                "resourceKey": "agents-serving-endpoint",
                "description": "Default streaming-capable LLM endpoint for agents that don't pin their own model",
                "permission": "CAN_QUERY",
                "fields": {
                  "name": {
                    "env": "DATABRICKS_SERVING_ENDPOINT_NAME",
                    "description": "Default LLM serving endpoint name",
                    "origin": "user"
                  }
                },
                "scope": "model-serving",
                "binding": {
                  "yamlKey": "serving_endpoint",
                  "varFields": [
                    [
                      "name",
                      "name"
                    ]
                  ]
                }
              },
              {
                "type": "experiment",
                "alias": "MLflow experiment for agent traces",
                "resourceKey": "agents-mlflow-experiment",
                "description": "When bound, agent turns and tool calls are traced to this MLflow experiment via OpenTelemetry. Tracing is a no-op when unset.",
                "permission": "CAN_EDIT",
                "fields": {
                  "experimentId": {
                    "env": "MLFLOW_EXPERIMENT_ID",
                    "description": "MLflow experiment id traces are logged to",
                    "origin": "user"
                  }
                },
                "binding": {
                  "yamlKey": "experiment",
                  "varFields": [
                    [
                      "experimentId",
                      "experiment_id"
                    ]
                  ]
                }
              },
              {
                "type": "volume",
                "alias": "Agent skills",
                "resourceKey": "agents-skills",
                "description": "Optional Unity Catalog Volume providing catalog-sourced agent skills (read-only)",
                "permission": "READ_VOLUME",
                "fields": {
                  "path": {
                    "env": "DATABRICKS_VOLUME_AGENT_SKILLS",
                    "description": "Volume path for agent skills (e.g. /Volumes/catalog/schema/skills)",
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "volume",
                      "select": "full_name"
                    },
                    "origin": "user"
                  }
                },
                "scope": "files",
                "binding": {
                  "yamlKey": "uc_securable",
                  "varFields": [
                    [
                      "path",
                      "securable_full_name"
                    ]
                  ],
                  "staticFields": [
                    [
                      "securable_type",
                      "VOLUME"
                    ]
                  ]
                }
              }
            ]
          },
          "stability": "beta"
        },
        "aiSearch": {
          "name": "aiSearch",
          "displayName": "AI Search Plugin",
          "description": "Query Databricks Vector Search indexes with built-in hybrid search, reranking, and pagination",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "vector_search_index",
                "alias": "Vector Search Index",
                "resourceKey": "vector-search-index",
                "description": "A Databricks Vector Search index to query. Index names configured via plugin config.",
                "permission": "SELECT",
                "fields": {
                  "id": {
                    "env": "DATABRICKS_VS_INDEX_NAME",
                    "description": "Three-level UC name of the default index (catalog.schema.index_name)",
                    "origin": "user"
                  }
                },
                "scope": "vector-search",
                "binding": {
                  "yamlKey": "uc_securable",
                  "varFields": [
                    [
                      "id",
                      "securable_full_name"
                    ]
                  ],
                  "staticFields": [
                    [
                      "securable_type",
                      "TABLE"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          },
          "stability": "beta",
          "scaffolding": {
            "rules": {
              "must": [
                "List the vector search index's source-table columns (unity-catalog tables API) so the user can pick which to return",
                "Ask the user which of those columns the search should return",
                "Write aiSearch({ indexes: { default: { columns: [...] } } }) in the server file; the client queries the 'default' alias"
              ]
            }
          }
        },
        "analytics": {
          "name": "analytics",
          "displayName": "Analytics Plugin",
          "description": "SQL query execution against Databricks SQL Warehouses",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "sql_warehouse",
                "alias": "SQL Warehouse",
                "resourceKey": "sql-warehouse",
                "description": "SQL Warehouse for executing analytics queries",
                "permission": "CAN_USE",
                "fields": {
                  "id": {
                    "env": "DATABRICKS_WAREHOUSE_ID",
                    "description": "SQL Warehouse ID",
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "warehouse"
                    },
                    "origin": "user"
                  }
                },
                "scope": "sql",
                "binding": {
                  "yamlKey": "sql_warehouse",
                  "varFields": [
                    [
                      "id",
                      "id"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          },
          "scaffolding": {
            "rules": {
              "must": [
                "Before init, ensure the SQL Warehouse passed via --set analytics.sql-warehouse.id is running"
              ],
              "should": [
                "After init, ensure config/queries/ has at least one .sql file before running npm run typegen"
              ]
            }
          }
        },
        "files": {
          "name": "files",
          "displayName": "Files Plugin",
          "description": "File operations against Databricks Volumes and Unity Catalog",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "volume",
                "alias": "Files",
                "resourceKey": "files",
                "description": "Permission to write to volumes",
                "permission": "WRITE_VOLUME",
                "fields": {
                  "path": {
                    "env": "DATABRICKS_VOLUME_FILES",
                    "description": "Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)",
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "volume",
                      "select": "full_name"
                    },
                    "origin": "user"
                  }
                },
                "scope": "files",
                "binding": {
                  "yamlKey": "uc_securable",
                  "varFields": [
                    [
                      "path",
                      "securable_full_name"
                    ]
                  ],
                  "staticFields": [
                    [
                      "securable_type",
                      "VOLUME"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          },
          "scaffolding": {
            "rules": {
              "must": [
                "Before init, verify your Unity Catalog volume exists and you have WRITE_VOLUME permission"
              ]
            }
          }
        },
        "genie": {
          "name": "genie",
          "displayName": "Genie Plugin",
          "description": "AI/BI Genie space integration for natural language data queries",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "genie_space",
                "alias": "Genie Space",
                "resourceKey": "genie-space",
                "description": "Genie Space for AI-powered data queries. Space IDs configured via plugin config.",
                "permission": "CAN_RUN",
                "fields": {
                  "id": {
                    "env": "DATABRICKS_GENIE_SPACE_ID",
                    "description": "Default Genie Space ID",
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "genie_space"
                    },
                    "origin": "user"
                  },
                  "name": {
                    "description": "Genie Space display name",
                    "origin": "user"
                  }
                },
                "scope": "genie",
                "binding": {
                  "yamlKey": "genie_space",
                  "varFields": [
                    [
                      "name",
                      "name"
                    ],
                    [
                      "id",
                      "space_id"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          },
          "scopes": [
            "genie"
          ],
          "scaffolding": {
            "rules": {
              "must": [
                "After init, configure the 'spaces' map in plugin config with alias-to-Space-ID mappings"
              ]
            }
          }
        },
        "jobs": {
          "name": "jobs",
          "displayName": "Jobs Plugin",
          "description": "Manage Databricks Lakeflow Jobs.",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "job",
                "alias": "Job",
                "resourceKey": "job",
                "description": "A Databricks job to trigger and monitor",
                "permission": "CAN_MANAGE_RUN",
                "fields": {
                  "id": {
                    "env": "DATABRICKS_JOB_ID",
                    "description": "Numeric Databricks job ID. Find it in the Jobs UI or via `databricks jobs list`.",
                    "origin": "user"
                  }
                },
                "binding": {
                  "yamlKey": "job",
                  "varFields": [
                    [
                      "id",
                      "id"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          }
        },
        "lakebase": {
          "name": "lakebase",
          "displayName": "Lakebase",
          "description": "SQL query execution against Databricks Lakebase Autoscaling",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "postgres",
                "alias": "Postgres",
                "resourceKey": "postgres",
                "description": "Lakebase Postgres database for persistent storage",
                "permission": "CAN_CONNECT_AND_CREATE",
                "fields": {
                  "project": {
                    "description": "Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.",
                    "bundleIgnore": true,
                    "examples": [
                      "projects/{project-id}"
                    ],
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "postgres_project",
                      "select": "name"
                    },
                    "origin": "user"
                  },
                  "branch": {
                    "description": "Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.",
                    "examples": [
                      "projects/{project-id}/branches/{branch-id}"
                    ],
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "postgres_branch",
                      "select": "name",
                      "dependsOn": "project"
                    },
                    "origin": "user"
                  },
                  "database": {
                    "description": "Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.",
                    "examples": [
                      "projects/{project-id}/branches/{branch-id}/databases/{database-id}"
                    ],
                    "discovery": {
                      "type": "kind",
                      "resourceKind": "postgres_database",
                      "select": "name",
                      "dependsOn": "branch"
                    },
                    "origin": "user"
                  },
                  "host": {
                    "env": "PGHOST",
                    "description": "Postgres host for local development. Auto-injected by the platform at deploy time.",
                    "localOnly": true,
                    "resolve": "postgres:host",
                    "origin": "platform"
                  },
                  "databaseName": {
                    "env": "PGDATABASE",
                    "description": "Postgres database name for local development. Auto-injected by the platform at deploy time.",
                    "localOnly": true,
                    "resolve": "postgres:databaseName",
                    "origin": "platform"
                  },
                  "endpointPath": {
                    "env": "LAKEBASE_ENDPOINT",
                    "description": "Lakebase endpoint resource name. Auto-injected at runtime via app.yaml valueFrom: postgres. For local development, obtain by running `databricks postgres list-endpoints {branch-name}`, select the desired item from the output array and use its .name value.",
                    "bundleIgnore": true,
                    "examples": [
                      "projects/{project-id}/branches/{branch-id}/endpoints/{endpoint-id}"
                    ],
                    "resolve": "postgres:endpointPath",
                    "origin": "cli"
                  },
                  "port": {
                    "env": "PGPORT",
                    "description": "Postgres port. Auto-injected by the platform at deploy time.",
                    "localOnly": true,
                    "value": "5432",
                    "origin": "platform"
                  },
                  "sslmode": {
                    "env": "PGSSLMODE",
                    "description": "Postgres SSL mode. Auto-injected by the platform at deploy time.",
                    "localOnly": true,
                    "value": "require",
                    "origin": "platform"
                  }
                },
                "appOnly": true,
                "binding": {
                  "yamlKey": "postgres",
                  "varFields": [
                    [
                      "branch",
                      "branch"
                    ],
                    [
                      "database",
                      "database"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          },
          "scaffolding": {
            "rules": {
              "should": [
                "After init, run any database migrations for your chosen ORM before first request",
                "After init, verify Lakebase connectivity with 'psql $PGHOST -c \"select 1\"'"
              ]
            }
          }
        },
        "server": {
          "name": "server",
          "displayName": "Server Plugin",
          "description": "HTTP server with Express, static file serving, and Vite dev mode support",
          "package": "@databricks/appkit",
          "resources": {
            "required": [],
            "optional": []
          },
          "requiredByTemplate": true
        },
        "serving": {
          "name": "serving",
          "displayName": "Model Serving Plugin (deprecated)",
          "description": "DEPRECATED: use the agents plugin instead. Authenticated proxy to Databricks Model Serving endpoints",
          "package": "@databricks/appkit",
          "resources": {
            "required": [
              {
                "type": "serving_endpoint",
                "alias": "Serving Endpoint",
                "resourceKey": "serving-endpoint",
                "description": "Model Serving endpoint for inference",
                "permission": "CAN_QUERY",
                "fields": {
                  "name": {
                    "env": "DATABRICKS_SERVING_ENDPOINT_NAME",
                    "description": "Serving endpoint name",
                    "origin": "user"
                  }
                },
                "scope": "model-serving",
                "binding": {
                  "yamlKey": "serving_endpoint",
                  "varFields": [
                    [
                      "name",
                      "name"
                    ]
                  ]
                }
              }
            ],
            "optional": []
          },
          "scopes": [
            "model-serving"
          ],
          "deprecated": true
        }
      },
      "scaffolding": {
        "command": "databricks apps init",
        "flags": {
          "--name": {
            "description": "Project name — sets {{app_name}} in package.json, databricks.yml, and .env. Required for non-interactive scaffolding.",
            "required": true,
            "pattern": "^[a-z][a-z0-9-]*$"
          },
          "--template": {
            "description": "Template path (local directory or GitHub URL)",
            "required": false
          },
          "--version": {
            "description": "AppKit version to use; defaults to auto-detected",
            "required": false
          },
          "--features": {
            "description": "Plugins to enable (comma-separated, no spaces; must match keys in this manifest's plugins map)",
            "required": false,
            "pattern": "^[a-zA-Z0-9_-]+(,[a-zA-Z0-9_-]+)*$"
          },
          "--set": {
            "description": "Set resource values (format: plugin.resourceKey.field=value, repeatable)",
            "required": false
          },
          "--output-dir": {
            "description": "Directory to write the project to",
            "required": false
          },
          "--description": {
            "description": "App description",
            "required": false
          },
          "--run": {
            "description": "Run the app after creation (none, dev, dev-remote)",
            "required": false
          },
          "--auto-approve": {
            "description": "Pass as a bare flag (no value) to skip prompts for optional resources. Not recommended for agent-driven init — conflicts with the 'ask user when in doubt' rule.",
            "required": false
          },
          "--profile": {
            "description": "Databricks CLI profile to use for authentication (global flag)",
            "required": false
          }
        },
        "rules": {
          "must": [
            "Treat `databricks apps init` output as starter code, not requirements; adapt or replace it to match the requested app",
            "Keep all secrets and credentials only in app.yaml, databricks.yml, and/or .env"
          ],
          "should": [
            "ask user when in doubt of resource to use for plugin"
          ],
          "never": [
            "guess resources when multiple or no options are available",
            "embed secrets in files that will go to the client-bundle"
          ]
        }
      }
    }
  databricks.yml: |
    bundle:
      name: {{app_name}}

    variables:
      files_path:
        description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)
      postgres_branch:
        description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
      postgres_database:
        description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.

    resources:
      apps:
        app:
          name: "{{app_name}}"
          description: "A Databricks App powered by AppKit"
          source_code_path: ./

          # Start the app automatically on deploy.
          lifecycle:
            started: true
          user_api_scopes:
            - files.files

          # The resources which this app has access to.
          resources:
            - name: files
              uc_securable:
                securable_full_name: ${var.files_path}
                securable_type: VOLUME
                permission: WRITE_VOLUME
            - name: postgres
              postgres:
                branch: ${var.postgres_branch}
                database: ${var.postgres_database}
                permission: CAN_CONNECT_AND_CREATE

    targets:
      default:
        default: true

        variables:
          files_path: "{{volume}}"
          postgres_branch: "{{branch}}"
          postgres_database: "{{database}}"
  package.json: |
    {
      "name": "{{app_name}}",
      "version": "1.0.0",
      "main": "dist/server.js",
      "type": "module",
      "scripts": {
        "start": "NODE_ENV=production node --env-file-if-exists=./.env ./dist/server.js",
        "dev": "NODE_ENV=development tsx watch --tsconfig ./tsconfig.server.json --env-file-if-exists=./.env ./server/server.ts",
        "build:client": "tsc -b tsconfig.client.json && vite build --config client/vite.config.ts",
        "build:server": "tsc -b tsconfig.server.json && tsdown -c tsdown.server.config.ts",
        "build": "npm run build:server && npm run build:client",
        "typecheck": "tsc -b tsconfig.server.json && tsc -b tsconfig.client.json",
        "lint": "eslint .",
        "lint:fix": "eslint . --fix",
        "lint:ast-grep": "appkit lint",
        "format": "prettier --check .",
        "format:fix": "prettier --write .",
        "test": "vitest run",
        "clean": "rm -rf client/dist dist build node_modules",
        "prebuild": "npm run sync && appkit generate-types --wait",
        "predev": "npm run sync && npm run typegen",
        "sync": "appkit plugin sync --write --silent",
        "typegen": "appkit generate-types",
        "setup": "appkit setup --write"
      },
      "keywords": [],
      "author": "",
      "license": "Unlicensed",
      "description": "A Databricks App powered by AppKit",
      "dependencies": {
        "@databricks/appkit": "0.84.0",
        "@databricks/appkit-ui": "0.84.0",
        "@databricks/sdk-experimental": "0.17.0",
        "clsx": "2.1.1",
        "embla-carousel-react": "8.6.0",
        "lucide-react": "0.546.0",
        "next-themes": "0.4.6",
        "react": "19.2.4",
        "react-dom": "19.2.4",
        "react-resizable-panels": "3.0.6",
        "react-router": "7.18.0",
        "tailwind-merge": "3.3.1",
        "tw-animate-css": "1.4.0",
        "tailwindcss-animate": "1.0.7",
        "zod": "4.3.6"
      },
      "devDependencies": {
        "@ast-grep/napi": "0.37.0",
        "@eslint/compat": "2.0.0",
        "@eslint/js": "9.39.1",
        "@tailwindcss/postcss": "4.1.17",
        "@tailwindcss/vite": "4.1.17",
        "@types/express": "5.0.5",
        "@types/node": "24.6.0",
        "@types/react": "19.2.2",
        "@types/react-dom": "19.2.2",
        "@typescript-eslint/eslint-plugin": "8.48.0",
        "@typescript-eslint/parser": "8.48.0",
        "@vitejs/plugin-react": "5.0.4",
        "autoprefixer": "10.4.21",
        "eslint": "9.39.1",
        "eslint-config-prettier": "10.1.8",
        "eslint-plugin-react": "7.37.5",
        "eslint-plugin-react-hooks": "7.0.1",
        "eslint-plugin-react-refresh": "0.4.24",
        "prettier": "3.6.2",
        "tailwindcss": "4.0.14",
        "tsdown": "0.20.3",
        "tsx": "4.20.6",
        "typescript": "5.9.3",
        "typescript-eslint": "8.48.0",
        "vite": "npm:rolldown-vite@7.1.14",
        "vitest": "4.1.9"
      },
      "optionalDependencies": {
        "@ast-grep/napi-linux-x64-gnu": "0.37.0"
      },
      "overrides": {
        "vite": "npm:rolldown-vite@7.1.14",
        "@opentelemetry/core": "2.8.0",
        "systeminformation": "5.31.7",
        "fast-uri": "3.1.0",
        "socks": "2.8.7",
        "bare-path": "3.1.1",
        "bare-url": "2.5.2"
      }
    }
  tsconfig.json: |
    {
      "files": [],
      "references": [{ "path": "./tsconfig.client.json" }, { "path": "./tsconfig.server.json" }]
    }
  tsconfig.client.json: |
    {
      "extends": "./tsconfig.shared.json",
      "compilerOptions": {
        "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.client.tsbuildinfo",
        "target": "ES2022",
        "useDefineForClassFields": true,
        "lib": ["ES2022", "DOM", "DOM.Iterable"],
        "types": ["vite/client"],

        /* Bundler mode */
        "allowImportingTsExtensions": true,
        "verbatimModuleSyntax": true,
        "moduleDetection": "force",
        "noEmit": true,
        "jsx": "react-jsx",

        /* Linting */
        "erasableSyntaxOnly": true,
        "noUncheckedSideEffectImports": true,

        /* Paths */
        "baseUrl": "./client",
        "paths": {
          "@/*": ["./src/*"]
        }
      },
      "include": ["client/src", "shared/appkit-types"]
    }
  tsconfig.server.json: |
    {
      "extends": "./tsconfig.shared.json",
      "compilerOptions": {
        "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.server.tsbuildinfo",
        "target": "ES2020",
        "lib": ["ES2020"],
        "noEmit": true,
        "rootDir": "./"
      },
      "include": ["server/**/*", "shared/**/*", "config/**/*"],
      "exclude": ["node_modules", "dist", "client"]
