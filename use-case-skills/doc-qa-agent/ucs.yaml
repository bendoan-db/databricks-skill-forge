# Source of truth for this use-case skill's dependency graph. Drift detection reads it, CI checks it against the module text,
# and scripts/check_base_skills.py reads base_skills at runtime.
name: doc-qa-agent
version: 0.2.0
owner: "@databricks-field/genai-ucs"        # drift issues are assigned here
dbs_release: dbs-2026.10                    # Forge base release; not published yet, so `upstream` is the working pin
upstream: databricks/databricks-agent-skills@v0.2.29   # written and certified against this tag (2026-10-12)
upstream_min: v0.2.27                       # oldest tag with every cited base skill and reference file
inputs:
  required: [volume_path]
  optional: [profile, target_schema, name, metadata_schema, chat_model, embedding_model, vs_endpoint, eval_set, page_images]

modules:
  - id: 00-preflight
    file: modules/00-preflight.md
    scripts: [scripts/check_base_skills.py]
    base_skills:
      - name: databricks-core
        version: 0.1.0
        uses: [profile selection, auth, warehouse discovery]
      - name: databricks-unity-gateway
        version: 0.1.0
        uses: [list system.ai model services, sovereign-cloud fallback]
      - name: databricks-vector-search
        version: 0.1.0
        uses: [endpoint types, list endpoints]
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [effective grants]

  - id: 01-ingest-parse
    file: modules/01-ingest-parse.md
    scripts: [scripts/render.py, scripts/databricks.yml, scripts/ingest.py, scripts/parse_documents.sql]
    base_skills:
      - name: databricks-ai-functions
        version: 0.2.0
        uses: [ai_parse_document v2 options, limits]
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [volumes, grants]
      - name: databricks-dabs
        version: unversioned                # upstream SKILL.md has no metadata.version
        uses: [bundle validate, deploy, run]
      - name: databricks-jobs
        version: 0.2.0
        uses: [file arrival trigger on volumes]
      - name: databricks-serverless
        version: 0.3.2
        uses: [environment_version]

  - id: 02-chunk-index
    file: modules/02-chunk-index.md
    scripts: [scripts/render.py, scripts/prep_chunks.sql, scripts/ingest.py, scripts/sync_index.py]
    base_skills:
      - name: databricks-ai-functions
        version: 0.2.0
        uses: [ai_prep_search]
      - name: databricks-vector-search
        version: 0.1.0
        uses: [standard endpoint, delta sync index, managed embeddings, columns_to_sync, hybrid search, dict filters]

  - id: 03-agent
    file: modules/03-agent.md
    scripts: [scripts/render.py, scripts/retrieval.py]
    base_skills:
      - name: databricks-unity-gateway
        version: 0.1.0
        uses: [system.ai model service permissions]
      - name: databricks-vector-search
        version: 0.1.0
        uses: [VectorSearchRetrieverTool]
    external:
      - name: databricks-agentbricks
        version: ">=0.5.0,<0.6"             # module 03 edits files generated by the 0.5 template; re-certify before widening
        uses: [init --framework langgraph --session-store, memory unbind, doctor, dev, agent-langgraph template]

  - id: 04-deploy-app
    file: modules/04-deploy-app.md
    scripts: [scripts/grant_index_access.py]
    base_skills:
      - name: databricks-apps-python
        version: 0.1.0
        uses: [app resources (uc_securable), app vs user authorization]
      - name: databricks-unity-catalog
        version: 0.3.0
        uses: [GRANT fallback]
    external:
      - name: databricks-agentbricks
        version: ">=0.5.0,<0.6"
        uses: [deploy, deployments get/logs, endpoint invoke]

  - id: 05-evaluate
    file: modules/05-evaluate.md
    scripts: [scripts/evaluate.py]
    base_skills:
      - name: databricks-mlflow-evaluation
        version: 0.1.0
        uses: [mlflow.genai.evaluate, built-in scorers, Guidelines, local predict_fn, trace ingestion]
    external:
      - name: databricks-agents
        version: ">=1.9.3"
        uses: [generate_evals_df]

# Capabilities this skill needs but the pinned base release doesn't cover, or covers with stale facts.
# The base-skill refiner reads these as routing hints (v_coverage_gaps). Docs win over base skills.
# SKILL.md "Base-skill guidance to override" holds the runtime instructions for each entry.
# After filing a change proposal upstream (drafts: docs/doc-qa-agent-upstream-proposals.md), add `upstream_issue: <url>`.
coverage_gaps:
  - capability: Agent Bricks CLI, agent.toml, DurableAgentServer, Agent Runtime on Databricks Apps
    modules: [03-agent, 04-deploy-app]
    kind: missing
    evidence:
      - url: https://docs.databricks.com/aws/en/agents/custom-agents/agent-bricks-cli
        date_modified: 2026-10-13
      - url: https://docs.databricks.com/aws/en/agents/deploy/agent-runtime
        date_modified: 2026-10-06
    stale_base_guidance: databricks-ml-training/references/genai-agents.md deploys LangGraph agents with agents.deploy() to Model Serving
  - capability: Managed agent sessions and memory stores
    modules: [03-agent]
    kind: missing
    evidence:
      - url: https://docs.databricks.com/aws/en/agents/custom-agents/stateful-agents
        date_modified: 2026-10-13
  - capability: Knowledge Assistant (databricks-agent-bricks) offered for document Q&A
    modules: [03-agent]
    kind: deprecated
    evidence: []                             # skill owner, 2026-10-15: Knowledge Assistant is being deprecated; add the notice URL once published
    stale_base_guidance: databricks-agent-bricks describes Knowledge Assistants for document Q&A
  - capability: AI Search rename and databricks-ai-search client
    modules: [02-chunk-index]
    kind: stale
    evidence:
      - url: https://docs.databricks.com/aws/en/ai-search/ai-search
        date_modified: 2026-09-14
  - capability: ai_prep_search schema option and per-chunk metadata
    modules: [02-chunk-index]
    kind: stale
    evidence:
      - url: https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_prep_search
        date_modified: 2026-09-11
  - capability: Production embedding model recommendation (databricks-qwen3-embedding-0-6b)
    modules: [00-preflight, 02-chunk-index]
    kind: stale
    evidence:
      - url: https://docs.databricks.com/aws/en/ai-search/create-ai-search
        date_modified: null                  # fill on the next ingest cycle

# Platform facts this skill hard-codes. The refiner re-checks them like coverage_gaps; when one changes,
# update every file in used_in.
facts:
  - fact: ai_parse_document accepts files up to 100 MB and 500 pages
    used_in: [scripts/ingest.py, modules/00-preflight.md, modules/01-ingest-parse.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/sql/language-manual/functions/ai_parse_document
        checked: 2026-10-15
  - fact: The Delta Sync embedding source column is capped at 32,764 bytes
    used_in: [scripts/prep_chunks.sql, modules/02-chunk-index.md]
    evidence: []                             # not found in the docs or base skills on 2026-10-15; needs a source
  - fact: App names are at most 30 characters, so <name> is at most 17
    used_in: [SKILL.md, modules/00-preflight.md, modules/04-deploy-app.md, scripts/render.py]
    evidence:
      - base_skill: databricks-dabs
        file: references/bundle-structure.md
        checked: 2026-10-15
  - fact: The default chat model is Claude Sonnet 5.5, model service system.ai.claude-sonnet-5-5 (legacy endpoint databricks-claude-sonnet-5-5)
    used_in: [SKILL.md, modules/00-preflight.md, modules/03-agent.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models
        checked: 2026-10-15
  - fact: An AI Search endpoint holds up to 50 indexes
    used_in: [modules/00-preflight.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/ai-search/ai-search
        checked: 2026-10-15
  - fact: Switch to STORAGE_OPTIMIZED above about 50M chunks
    kind: heuristic                          # docs give STANDARD capacity as 320M vectors at 768 dims; 50M is this skill's cost threshold
    used_in: [SKILL.md]
    evidence:
      - url: https://docs.databricks.com/aws/en/ai-search/ai-search
        checked: 2026-10-15

scenarios: evals/scenarios.yaml
