# End-to-end certification scenarios for doc-qa-agent.
# forge_ucs_validate runs these on every PR (U5), and forge_ucs_drift runs them on each base release (U9).
# Each run executes modules 00-05 in a sandbox workspace twice: with this skill (candidate) and with
# base skills only (base-only). The candidate must pass every check and must not score below base-only.

defaults:
  harness:
    auto_approve_cost_gates: sandbox_only    # never auto-approve outside the certification workspace
    teardown: [app, index, endpoint_if_created, job, tables]
    upstream_versions: [v0.2.27, latest]     # databricks-agent-skills installed next to the skill: ucs.yaml upstream_min, and the newest tag
  thresholds:                                # same floors as scripts/evaluate.py
    retrieval_groundedness: 0.8
    relevance_to_query: 0.8
    correctness: 0.6
  checks:                                    # apply to every scenario, in addition to its own checks
    - no_knowledge_assistant                 # the agent never creates or suggests an Agent Bricks Knowledge Assistant (being deprecated)

# Routing evals: with every databricks-agent-skills skill installed next to this one, each prompt runs in a
# fresh session, and the harness records which skill the agent loads first. Cheap enough to run on every PR.
routing:
  should_trigger:
    - "Build a chatbot that answers questions about the PDFs in /Volumes/main/legal/contracts, with citations"
    - "I need a RAG agent over our policy documents in a Unity Catalog volume, deployed as a Databricks App"
    - "Let people chat with the Word and PowerPoint files in /Volumes/hr/docs/handbook"
    - "Create a document Q&A agent on Databricks and measure how accurate it is"
  should_not_trigger:
    - prompt: "Extract the invoice number, vendor, and total from the PDFs in my volume into a table"
      expected: databricks-ai-functions      # structured-doc-extraction once it ships
    - prompt: "Create a vector search index on main.sales.products for semantic product search"
      expected: databricks-vector-search
    - prompt: "Write a SQL query that runs ai_parse_document on one file"
      expected: databricks-ai-functions
    - prompt: "Train an XGBoost churn model and register it in Unity Catalog"
      expected: databricks-ml-training

scenarios:
  - id: financebench-sec-filings
    description: SEC filings Q&A over the foundation repo's corpus, with metadata filters
    source:
      repo: https://github.com/bendoan-db/databricks-financebench-agent
      documents: data/pdfs                   # 368 PDFs, ~673 MB
      eval_set: data/finance_bench_evals.tsv # 150 rows: request, expected_response, expected_retrieved_context[{content, doc_uri}]
    sample:
      # doc_uri basenames carry a 'financebench' prefix; strip it to match data/pdfs file names.
      questions: 30                          # stratify by company; keep only questions whose doc_uri is in the document sample
      documents: questions_plus_distractors  # each sampled question's source docs + 10 random others
    inputs:
      metadata_schema: >-
        {"company": {"type": "string", "description": "Issuer common name in upper case with no spaces or punctuation, e.g. JOHNSONJOHNSON"},
         "document_type": {"type": "enum", "labels": ["10K", "10Q", "8K", "EARNINGS"]},
         "fiscal_year": {"type": "integer", "description": "Fiscal year the document covers"}}
    checks:
      - parsed_files == sampled_documents
      - chunks_index.indexed_row_count == chunks.count
      - missing_metadata_ratio <= 0.10
      - app_status == RUNNING
      - live_invoke_returns_citation          # [file_name, p. N] present in the deployed app's answer
      - unanswerable_questions_declined >= 4/5

  - id: mixed-office-docs
    description: Non-PDF formats and no metadata schema; covers parse options and the unfiltered tool path
    source:
      generate: databricks-unstructured-pdf-generation   # base skill; also add 3 DOCX, 2 PPTX, 2 PNG scans
      documents: 15
    inputs:
      metadata_schema: ""
    eval_set: synthetic                      # module 05 synthesis, 15 questions
    checks:
      - parsed_files == 15
      - chunks_index.indexed_row_count == chunks.count
      - live_invoke_returns_citation

  - id: incremental-refresh
    description: The file-arrival job picks up an added file and drops a deleted one without reparsing others
    depends_on: mixed-office-docs
    steps: [add 1 new PDF, delete 1 existing file, wait for the job run]
    checks:
      - changed_files == 1                   # ingest.py summary for the triggered run
      - deleted_file_chunks == 0
      - new_file_answerable                  # a question about the new file is answered with its citation
